# CI on Google Cloud Build (GitHub Actions is unavailable for this repository).
#   gcloud builds submit --config cloudbuild.yaml .
# Python 3.11 and 3.12 run the test suite in parallel with core dependencies only (no Ollama,
# no Qiskit), then 3.12 builds the wheel, installs it in a clean venv and imports the console.
# Logs go to Cloud Logging. No secrets are used or needed.
steps:
  - id: tests-py311
    name: python:3.11-slim
    waitFor: ["-"]
    entrypoint: bash
    args: ["-c", "pip install -q numpy scipy requests PyYAML rich pytest && python -m pytest -q -p no:cacheprovider tests"]
  - id: tests-py312
    name: python:3.12-slim
    waitFor: ["-"]
    entrypoint: bash
    args: ["-c", "pip install -q numpy scipy requests PyYAML rich pytest && python -m pytest -q -p no:cacheprovider tests"]
  - id: wheel-smoke
    name: python:3.12-slim
    waitFor: ["tests-py312"]
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q build && python -m build -q --wheel --outdir /tmp/wheel . &&
        python -m venv /tmp/wv && /tmp/wv/bin/pip install -q /tmp/wheel/*.whl && cd /tmp &&
        /tmp/wv/bin/osiris --help > /dev/null &&
        /tmp/wv/bin/python -c "import osiris_cli, osiris_termux_console, protege, osiris_bench; print('console', osiris_cli.__version__, '| bench tasks', len(osiris_bench.load_tasks()))"
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
