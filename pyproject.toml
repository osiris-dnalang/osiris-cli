[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-cli"
version = "4.5.3"
description = "OSIRIS: a governed local console for a living language model that learns from every conversation and speaks only after passing a held-out gate"
readme = "README.md"
license = {text = "LicenseRef-OSIRIS-Dual-v1.0"}
requires-python = ">=3.9"
authors = [
    {name = "Devin Phillip Davis", email = "devin@agiledefensesystems.com"},
]
keywords = [
    "language-model",
    "continual-learning",
    "local-first",
    "provenance",
    "dna-lang",
    "nclm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=0.43.0",
    "qiskit-ibm-runtime>=0.14.0",
    "qiskit-aer>=0.13.0",
]
tui = [
    "textual>=0.40.0",
]
plot = [
    "matplotlib>=3.7.0",
]
forge = [
    "trimesh>=4.0.0",
    "paho-mqtt>=1.6.0",
    "zeroconf>=0.80.0",
]
all = [
    "osiris-cli[quantum,tui,plot,forge]",
]
# The sibling research repos (optional; the console guards every import of them).
research = [
    "dnalang @ git+https://github.com/osiris-dnalang/dnalang-core.git",
    "organism_sim @ git+https://github.com/osiris-dnalang/organism_sim.git",
    "aegis-bridge @ git+https://github.com/osiris-dnalang/bridge.git",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
osiris = "osiris_cli.osiris_repl:main"

[project.urls]
Homepage = "https://github.com/osiris-dnalang/osiris-cli"
Repository = "https://github.com/osiris-dnalang/osiris-cli"
Issues = "https://github.com/osiris-dnalang/osiris-cli/issues"

[tool.setuptools]
py-modules = [
    "osiris_launcher",
    "osiris_livlm",
    "osiris_ncllm_swarm",
    "osiris_ultra_coder",
    "osiris_auto_discovery",
    "osiris_orchestrator",
    "osiris_rqc_framework",
    "osiris_rqc_orchestrator",
    "osiris_ibm_execution",
    "osiris_ibm_runtime",
    "osiris_quantum_benchmarker",
    "osiris_benchmark_suite",
    "osiris_sovereign_executor",
    "osiris_torsion_core_py",
    "osiris_physics_bridges",
    "osiris_cognitive_mesh",
    "osiris_bridge_validator",
    "osiris_elo_tournament",
    "osiris_introspection",
    "osiris_feedback_bus",
    "osiris_intent_engine",
    "osiris_ollama",
    "osiris_shell",
    "osiris_tui",
    "osiris_tui_core",
    "osiris_integrated",
    "osiris_forge",
    "osiris_fabric_bridge",
    "osiris_policy_upcycle",
    "osiris_fei_demo",
    "osiris_manufacturing_3mf",
    "osiris_zenodo_publisher",
    "osiris_publication_zenodo",
    "osiris_license",
    "osiris_verify",
    "osiris_agents",
    "osiris_applications",
    "osiris_master_prompt",
    "osiris_zerosum_microvm",
    "osiris_quantum_bridge",
    "osiris_hardware_mesh",
    "osiris_swarm_governance",
    "omega_recursive_engine",
    "k8_preregistration",
    "osiris_unified_livlm",
    "osiris_comparative_benchmark",
    "osiris_termux_console",
    "osiris_ui",
    "intent_router",
    "db_ledger",
    "experiments",
    "gaps",
    "gemini_bridge",
    "genome",
    "genome_ledger",
    "osiris_ast_bridge",
    "payload_gate",
    "research",
    "run_record",
    "session_state",
    "sprint_manager",
    "structured_proposal",
    "verify_loop",
    "vision_indexer",
    # Console modules and scripts that were imported or run but never packaged before 4.3.1
    "algorithmic_dd_generator",
    "bench_trial",
    "capabilities",
    "dd_sim",
    "discover",
    "dna_lang",
    "evolve",
    "nclm_aer_evaluator",
    "osiris_bench",
    "osiris_local_qvm",
    "paste_digest",
    "pretrain_nclm",
    "prompt_strategies",
    "protege",
    "trials",
    "verify_ledger",
]

[tool.setuptools.packages.find]
include = ["osiris*", "osiris_cli*", "nclm*", "qbyte_system*", "quantum_discovery*", "scimitar_sse*", "bench_tasks", "rqc*"]
namespaces = true   # bench_tasks has no __init__.py: a .py there would change osiris_bench.suite_sha256

[tool.setuptools.package-data]
# the benchmark task definitions are data the console and osiris_bench read from <site-packages>/bench_tasks
bench_tasks = ["*/*", "*/*/*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

